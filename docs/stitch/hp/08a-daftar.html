<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior:none;background-color:#fbf9f0;background-image:linear-gradient(#D9E6F2 1px, transparent 1px), linear-gradient(90deg, #D9E6F2 1px, transparent 1px);background-size:26px 26px;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary": "#725c00", "on-error": "#ffffff", "secondary": "#436084", "on-tertiary-fixed": "#001d35", "on-secondary-fixed": "#001c38", "inverse-surface": "#30312b", "surface-bright": "#fbf9f0", "surface-dim": "#dcdad2", "on-primary-container": "#735e00", "secondary-fixed-dim": "#abc9f2", "on-background": "#1b1c17", "inverse-on-surface": "#f3f1e8", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#00497c", "on-tertiary-container": "#0063a4", "inverse-primary": "#e9c339", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary": "#0061a2", "tertiary-fixed": "#d1e4ff", "outline-variant": "#d0c6ae", "surface-container-low": "#f6f4eb", "surface-tint": "#725c00", "tertiary-container": "#c3ddff", "on-secondary-container": "#3f5b7f", "error-container": "#ffdad6", "on-primary-fixed-variant": "#564500", "surface-variant": "#e4e3da", "on-secondary": "#ffffff", "primary-fixed": "#ffe07e", "primary-container": "#ffd84d", "on-primary-fixed": "#231b00", "surface-container": "#f0eee5", "surface-container-lowest": "#ffffff", "outline": "#7e7662", "surface": "#fbf9f0", "on-surface-variant": "#4d4634", "on-primary": "#ffffff", "primary-fixed-dim": "#e9c339", "surface-container-high": "#eae8e0", "on-secondary-fixed-variant": "#2b486b", "tertiary-fixed-dim": "#9dcaff", "on-surface": "#1b1c17", "background": "#fbf9f0", "secondary-container": "#b6d4fe", "secondary-fixed": "#d2e4ff", "surface-container-highest": "#e4e3da" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-sm": "0.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-xl": "2rem", "space-lg": "1.5rem", "margin": "1rem" }, "fontFamily": { "headline-md": ["Rubik"], "body-md": ["Nunito Sans"], "label-section": ["Nunito Sans"], "display-lg": ["Rubik"], "display-lg-mobile": ["Rubik"], "headline-sm": ["Rubik"], "headline-lg": ["Rubik"], "label-sm": ["Nunito Sans"], "body-bold": ["Nunito Sans"], "body-lg": ["Nunito Sans"] }, "fontSize": { "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-section": ["13px", { "lineHeight": "18px", "letterSpacing": "0.08em", "fontWeight": "800" }], "display-lg": ["36px", { "lineHeight": "44px", "fontWeight": "800" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "fontWeight": "800" }], "headline-sm": ["19px", { "lineHeight": "26px", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "body-bold": ["16px", { "lineHeight": "24px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen items-center selection:bg-primary-container"><div class="w-full max-w-[460px] flex flex-col min-h-screen relative shadow-[0_0_24px_rgba(27,58,92,0.06)]"><header class="fixed top-0 w-full max-w-[460px] z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Kembali" class="w-12 h-12 flex items-center justify-center rounded-xl text-on-surface hover:text-secondary active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col"><span class="font-label-section text-label-section uppercase text-secondary tracking-wider">Yuk Ngeles</span><span class="font-headline-sm text-headline-sm text-on-surface leading-tight">Daftar Akun</span></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-safe bg-transparent flex-grow"><div class="flex flex-col w-full pb-8">
<!-- Friendly Motivation Badge / Sticky Tape Decor -->
<div class="flex justify-between items-center mb-4 mt-2">
<div class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-container rounded-lg shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-sm text-label-sm text-on-surface">Buku Latihan Digital</span>
</div>
<div class="inline-flex items-center gap-1 px-2.5 py-1 bg-tertiary-container text-on-tertiary-container rounded-full text-xs font-bold shadow-sm">
<span class="material-symbols-outlined text-[16px]">stars</span>
<span>TKA Matematika</span>
</div>
</div>
<!-- Main Title Area -->
<div class="flex flex-col gap-1 mb-5">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight flex items-center flex-wrap gap-x-2">
<span>Daftar Dulu</span>
<span class="bg-primary-container text-on-primary-container px-2 py-0.5 rounded-lg inline-block transform -rotate-1 shadow-sm">
        Yuk
      </span>
</h1>
<p class="font-body-md text-body-md text-secondary">
      Biar nilai TO kamu tersimpan.
    </p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-[4px_4px_0px_#1b3a5c] flex flex-col gap-4 relative overflow-hidden" style="border: 2.5px solid #1B3A5C;">
<!-- Notebook Paper Decorative Corner Pin -->
<div class="absolute -top-3 -right-3 w-8 h-8 bg-primary-fixed rounded-full flex items-center justify-center shadow-[1px_1px_0px_#1b3a5c]" style="border: 1.5px solid #1B3A5C;">
<span class="material-symbols-outlined text-on-primary-fixed text-[16px]">push_pin</span>
</div>
<!-- Input 1: Nama Panggilan -->
<div class="flex flex-col gap-1.5">
<label class="font-body-bold text-body-bold text-on-surface flex items-center gap-1.5" for="nama">
<span class="material-symbols-outlined text-[18px] text-secondary">face</span>
<span>Nama panggilan</span>
</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline bg-surface-bright focus:outline-none focus:bg-surface-container-lowest transition-colors" id="nama" placeholder="Misal: Budi atau Rara" style="border: 2px solid #1B3A5C;" type="text"/>
</div>
</div>
<!-- Input 2: Username -->
<div class="flex flex-col gap-1.5">
<label class="font-body-bold text-body-bold text-on-surface flex items-center gap-1.5" for="username">
<span class="material-symbols-outlined text-[18px] text-secondary">alternate_email</span>
<span>Username</span>
</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline bg-surface-bright focus:outline-none focus:bg-surface-container-lowest transition-colors" id="username" placeholder="budi_smp9 (tanpa spasi)" style="border: 2px solid #1B3A5C;" type="text"/>
</div>
</div>
<!-- Input 3: Password -->
<div class="flex flex-col gap-1.5">
<label class="font-body-bold text-body-bold text-on-surface flex items-center gap-1.5" for="password">
<span class="material-symbols-outlined text-[18px] text-secondary">lock</span>
<span>Password</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline bg-surface-bright focus:outline-none focus:bg-surface-container-lowest transition-colors" id="password" placeholder="Minimal 6 karakter seru" style="border: 2px solid #1B3A5C;" type="password"/>
<button aria-label="Tampilkan atau sembunyikan password" class="absolute right-1 w-10 h-10 flex items-center justify-center text-secondary hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Parental Awareness Checkbox -->
<div class="mt-1">
<label class="flex items-start gap-3 cursor-pointer select-none group">
<div class="relative flex items-center justify-center shrink-0 mt-0.5">
<input class="peer sr-only" id="parentalConsent" type="checkbox"/>
<div class="w-6 h-6 rounded-lg bg-surface-bright peer-checked:bg-primary-container flex items-center justify-center transition-all group-active:scale-95 shadow-sm" style="border: 2px solid #1B3A5C;">
<span class="material-symbols-outlined text-[#1B3A5C] text-[18px] font-black opacity-0 peer-checked:opacity-100 transition-opacity">
              check
            </span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface leading-snug">
          Orang tua atau wali sudah tahu aku daftar di sini
        </span>
</label>
</div>
<!-- Submit Action Button -->
<button class="w-full mt-2 h-13 py-3.5 px-4 bg-primary-container text-[#1B3A5C] rounded-2xl font-headline-md text-headline-md tracking-wide text-center active:translate-x-[2px] active:translate-y-[2px] transition-transform select-none shadow-[4px_4px_0px_#1B3A5C] flex items-center justify-center gap-2" style="border: 2.5px solid #1B3A5C;" type="button">
<span>Daftar</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
<!-- Bottom Masuk Link -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface">
      Sudah punya akun? 
      <a class="font-body-bold text-[#1B3A5C] underline underline-offset-4 decoration-2 hover:text-primary transition-colors ml-1 inline-flex items-center" href="#masuk">
        Masuk
      </a>
</p>
</div>
<!-- Playful Notebook Sticker / Doodle Accent at Bottom -->
<div class="mt-8 flex justify-center items-center gap-2">
<div class="flex items-center gap-2 bg-surface-container px-3.5 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-[18px] text-tertiary">rocket_launch</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Siap taklukkan soal matematika bareng!</span>
</div>
</div>
</div>
<script>
  (function() {
    var toggleBtn = document.getElementById('togglePassword');
    var passwordInput = document.getElementById('password');
    var eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        var isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></div></body></html>
