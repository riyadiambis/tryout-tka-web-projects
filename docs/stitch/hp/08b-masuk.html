<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&amp;family=Rubik:ital,wght@0,500;0,700;0,800;1,500;1,700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior:none;background-color:#fbf9f0;background-image:linear-gradient(#D9E6F2 1px, transparent 1px), linear-gradient(90deg, #D9E6F2 1px, transparent 1px);background-size:26px 26px;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary": "#725c00", "on-error": "#ffffff", "secondary": "#436084", "on-tertiary-fixed": "#001d35", "on-secondary-fixed": "#001c38", "inverse-surface": "#30312b", "surface-bright": "#fbf9f0", "surface-dim": "#dcdad2", "on-primary-container": "#735e00", "secondary-fixed-dim": "#abc9f2", "on-background": "#1b1c17", "inverse-on-surface": "#f3f1e8", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#00497c", "on-tertiary-container": "#0063a4", "inverse-primary": "#e9c339", "on-error-container": "#93000a", "on-tertiary": "#ffffff", "tertiary": "#0061a2", "tertiary-fixed": "#d1e4ff", "outline-variant": "#d0c6ae", "surface-container-low": "#f6f4eb", "surface-tint": "#725c00", "tertiary-container": "#c3ddff", "on-secondary-container": "#3f5b7f", "error-container": "#ffdad6", "on-primary-fixed-variant": "#564500", "surface-variant": "#e4e3da", "on-secondary": "#ffffff", "primary-fixed": "#ffe07e", "primary-container": "#ffd84d", "on-primary-fixed": "#231b00", "surface-container": "#f0eee5", "surface-container-lowest": "#ffffff", "outline": "#7e7662", "surface": "#fbf9f0", "on-surface-variant": "#4d4634", "on-primary": "#ffffff", "primary-fixed-dim": "#e9c339", "surface-container-high": "#eae8e0", "on-secondary-fixed-variant": "#2b486b", "tertiary-fixed-dim": "#9dcaff", "on-surface": "#1b1c17", "background": "#fbf9f0", "secondary-container": "#b6d4fe", "secondary-fixed": "#d2e4ff", "surface-container-highest": "#e4e3da" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-sm": "0.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-xl": "2rem", "space-lg": "1.5rem", "margin": "1rem" }, "fontFamily": { "headline-md": ["Rubik"], "body-md": ["Nunito Sans"], "label-section": ["Nunito Sans"], "display-lg": ["Rubik"], "display-lg-mobile": ["Rubik"], "headline-sm": ["Rubik"], "headline-lg": ["Rubik"], "label-sm": ["Nunito Sans"], "body-bold": ["Nunito Sans"], "body-lg": ["Nunito Sans"] }, "fontSize": { "headline-md": ["22px", { "lineHeight": "30px", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-section": ["13px", { "lineHeight": "18px", "letterSpacing": "0.08em", "fontWeight": "800" }], "display-lg": ["36px", { "lineHeight": "44px", "fontWeight": "800" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "fontWeight": "800" }], "headline-sm": ["19px", { "lineHeight": "26px", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "body-bold": ["16px", { "lineHeight": "24px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen items-center selection:bg-primary-container"><div class="w-full max-w-[460px] flex flex-col min-h-screen relative shadow-[0_0_24px_rgba(27,58,92,0.06)]"><header class="fixed top-0 w-full max-w-[460px] z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Kembali" class="w-12 h-12 flex items-center justify-center rounded-xl text-on-surface hover:text-secondary active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col"><span class="font-label-section text-label-section uppercase text-secondary tracking-wider">Yuk Ngeles</span><span class="font-headline-sm text-headline-sm text-on-surface leading-tight">Login</span></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-safe bg-transparent flex-grow"><div class="flex flex-col w-full pb-8">
<!-- Hero / Heading Section with Notebook Aesthetic -->
<div class="flex flex-col items-center text-center mt-2 mb-6 relative">
<!-- Playful Stationery Pin Icon -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-section text-label-section mb-3 shadow-sm">
<span class="material-symbols-outlined text-[16px]">edit_note</span>
<span>BUKU CATATAN DIGITAL</span>
</div>
<!-- Main Title with Highlighter Doodle Accent -->
<div class="relative inline-block px-4 py-1">
<!-- Highlighter Swash Background Doodle -->
<span class="absolute inset-x-1 bottom-1.5 h-4 bg-primary-container/80 rounded-md -rotate-1 -z-10 transform origin-left"></span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-secondary tracking-tight">
        Masuk
      </h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mt-1.5">
      Yuk lanjut belajar dan cek riwayat belajarmu!
    </p>
</div>
<!-- Form Card with Neobrutalist Stationery Feel -->
<div class="bg-surface-container-lowest rounded-2xl p-5 mb-5 shadow-[4px_4px_0px_#436084] relative overflow-hidden transition-all">
<!-- Decorative Notebook Header Ribbon inside card -->
<div class="flex items-center justify-between pb-3 mb-4 border-b border-surface-variant">
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-error"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary-container"></span>
<span class="w-2.5 h-2.5 rounded-full bg-tertiary"></span>
</div>
<span class="font-label-section text-label-section text-secondary uppercase tracking-wider flex items-center gap-1">
<span class="material-symbols-outlined text-[15px]">lock</span>
        AKUN SISWA
      </span>
</div>
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-body-bold text-body-bold text-secondary flex items-center gap-1.5" for="username">
<span class="material-symbols-outlined text-[18px]">person</span>
          Username
        </label>
<div class="relative flex items-center">
<input autocomplete="username" class="w-full h-12 px-4 rounded-xl bg-surface text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:bg-surface-bright transition-all shadow-inner" id="username" placeholder="Username kamu" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-body-bold text-body-bold text-secondary flex items-center gap-1.5" for="password">
<span class="material-symbols-outlined text-[18px]">key</span>
          Password
        </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-12 rounded-xl bg-surface text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:bg-surface-bright transition-all shadow-inner" id="password" placeholder="Masukkan password" type="password"/>
<button aria-label="Lihat password" class="absolute right-1 w-10 h-10 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface active:scale-90 transition-transform" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button: Masuk -->
<button class="w-full h-13 py-3 px-4 mt-2 rounded-2xl bg-primary-container text-on-primary-container font-headline-sm text-headline-sm tracking-wide shadow-[4px_4px_0px_#436084] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_#436084] transition-all flex items-center justify-center gap-2 group cursor-pointer" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[22px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- WhatsApp Support Card -->
<div class="bg-surface-container-low rounded-xl p-3.5 mb-4 shadow-sm flex items-center justify-between gap-3 text-left">
<div class="flex items-center gap-2.5 min-w-0">
<div class="w-9 h-9 rounded-full bg-tertiary-container flex items-center justify-center shrink-0 shadow-xs">
<span class="material-symbols-outlined text-on-tertiary-container text-[20px]">chat</span>
</div>
<p class="font-body-md text-label-sm text-on-surface-variant leading-snug">
        Lupa password? Hubungi admin lewat WhatsApp.
      </p>
</div>
<a aria-label="Hubungi WhatsApp" class="shrink-0 h-10 px-3 rounded-lg bg-surface-container-lowest text-secondary font-body-bold text-label-sm flex items-center gap-1 hover:bg-secondary-container active:scale-95 transition-all shadow-xs" href="https://wa.me/" rel="noopener noreferrer" target="_blank">
<span>Bantuan</span>
<span class="material-symbols-outlined text-[16px]">open_in_new</span>
</a>
</div>
<!-- Register Link Footer -->
<div class="flex items-center justify-center py-2 text-center">
<a class="inline-flex items-center gap-1 font-body-bold text-body-md text-secondary hover:text-tertiary underline decoration-2 underline-offset-4 py-2 px-3 rounded-lg hover:bg-surface-container-high transition-colors min-h-[48px]" href="#daftar">
<span>Belum punya akun? Daftar dulu</span>
<span class="material-symbols-outlined text-[18px]">person_add</span>
</a>
</div>
<!-- Micro Visual Delight Stamp -->
<div class="mt-6 flex justify-center opacity-70">
<div class="flex items-center gap-2 text-outline text-label-section font-label-section tracking-wider">
<span class="material-symbols-outlined text-[16px]">school</span>
<span>SIAP HADAPI TKA MATEMATIKA</span>
</div>
</div>
</div>
<script>
  (function () {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('togglePasswordIcon');

    if (toggleBtn && pwdInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Lihat password');
      });
    }
  })();
</script></main></div></body></html>
